# Single source of truth for hub <-> HA (ws) and hub <-> remote (rf) messages.
# Wire types: u8 u16 u32 i32 bool str bytes enum:<name> json (json: ws-only).
# ws envelope: {"v": 1, "id": <u32>, "t": "<name>", "d": {...}}
version: 1

enums:
  key_action: {press: 0, release: 1, hold: 2}

messages:
  - name: hello
    code: 1
    transport: ws
    fields:
      - {name: token, type: str}
      - {name: client, type: str, optional: true}

  - name: hello_ack
    code: 2
    transport: ws
    fields:
      - {name: hub_id, type: str}
      - {name: fw_version, type: str, optional: true}
      - {name: activities, type: json, optional: true}
      - {name: config_hash, type: str, optional: true}
      # The hub's config limits (see docs/proto/config-format-2.md "Limits"): {budget, chunk, dev_b,
      # cmd_b, key_b, word_b, max_devices, max_activities, max_keys, max_steps, max_act_devs,
      # max_pronto, name_max}. Absent = an older hub with the fixed limits and no config_chunk.
      - {name: limits, type: json, optional: true}
      - {name: fw_build, type: u32, optional: true}   # installed firmware build id (OTA floor)
      - {name: ota_key, type: str, optional: true}    # "dev" (public test key built in) | "release"; absent = no OTA
      # Hub identity (docs/proto/hub-identity.md), all absent on older firmware: the display name (UTF-8, <= 48
      # bytes, omitted when none is set), the stable hardware id (the same hub across renames; omitted when the hub
      # cannot read one), rename = the hub understands set_hub_id, id_pinned = hub.conf pins the id (set_hub_id
      # is refused until the pin is removed on the device).
      - {name: name, type: str, optional: true}
      - {name: hw_id, type: str, optional: true}
      - {name: rename, type: bool, optional: true}
      - {name: id_pinned, type: bool, optional: true}
      # Bluetooth HID (docs/proto/bluetooth.md): present only when the hub build has Bluetooth:
      # {hosts_max, conn_max, remotes_max, le_bonds_max, pages: [7, 12], le} (paired-host limit, simultaneous-connection limit, HID usage pages, LE supported). Absent = no bt_* messages.
      - {name: bt, type: json, optional: true}

  - name: error
    code: 3
    transport: ws
    fields:
      - {name: code, type: str}
      - {name: message, type: str}
      - {name: ref_id, type: u32, optional: true}

  - {name: ping, code: 4, transport: ws, fields: []}
  - {name: pong, code: 5, transport: ws, fields: []}

  - name: set_config
    code: 6
    transport: ws
    fields:
      - {name: config, type: json}

  # set_config for configs too large for one frame: the compact config text in order, `seq` from 0,
  # `total` = byte length of the whole text (same on every chunk). Each chunk is answered with a
  # config_ack ({ok:true} until the last, which carries the load result like set_config's);
  # a chunk out of order or a failed load drops the transfer (config_ack ok:false).
  - name: config_chunk
    code: 25
    transport: ws
    fields:
      - {name: seq, type: u32}
      - {name: total, type: u32}
      - {name: data, type: str}

  - name: config_ack
    code: 7
    transport: ws
    fields:
      - {name: ok, type: bool}
      - {name: message, type: str, optional: true}
      - {name: config_hash, type: str, optional: true}  # hash the hub holds after a successful load

  - name: command
    code: 8
    transport: ws
    fields:
      - {name: device, type: str}
      - {name: command, type: str}
      - {name: args, type: json, optional: true}

  - name: command_result
    code: 9
    transport: ws
    fields:
      - {name: ok, type: bool}
      - {name: message, type: str, optional: true}

  - name: key_event
    code: 10
    transport: both
    fields:
      - {name: remote, type: u8}
      - {name: key, type: u8}
      - {name: action, type: "enum:key_action"}

  - name: state_update
    code: 11
    transport: both
    fields:
      - {name: activity, type: u8}
      - {name: power, type: bool}

  - name: page_push
    code: 12
    transport: both
    fields:
      - {name: remote, type: u8}
      - {name: page, type: u8}
      - {name: data, type: bytes}

  - name: battery
    code: 13
    transport: both
    fields:
      - {name: remote, type: u8}
      - {name: percent, type: u8}
      - {name: millivolts, type: u16}

  - name: device_state
    code: 14
    transport: ws
    fields:
      - {name: device, type: str}
      - {name: power, type: bool}
      - {name: input, type: str, optional: true}

  - name: tile_update
    code: 15
    transport: rf
    fields:
      - {name: remote, type: u8}
      - {name: page, type: u8}
      - {name: tile, type: u8}
      - {name: text, type: str}

  # Pushed to every authenticated client except the set_config sender after a successful
  # set_config, so clients learn the new activity list without reconnecting. Same content as
  # hello_ack.activities / hello_ack.config_hash (array index == state_update.activity).
  - name: activity_list
    code: 16
    transport: ws
    fields:
      - {name: activities, type: json}
      - {name: config_hash, type: str, optional: true}

  # A remote attached on the RF link (pushed to every authenticated client). The link carries no
  # remote id until the remote's first message, so there are no fields: clients (re)push pages
  # and tile texts for every remote they manage.
  - {name: remote_attached, code: 17, transport: ws, fields: []}

  # Page format handshake (docs/plans/2026-11-18-page-format-v2.md): the remote's first uplink after
  # each link-up; the hub caches it and relays it on ws. page_fmt 2 = understands v2 pages; caps bit 0
  # tile_state, bit 1 page store/paging; icons = highest stock icon id the remote's font knows;
  # gen / pages = the generation of the v2 page set the remote holds and how many of its pages it holds
  # (0 / 0 when none), so a client can skip a push that would change nothing.
  - name: remote_info
    code: 18
    transport: both
    fields:
      - {name: remote, type: u8}
      - {name: page_fmt, type: u8}
      - {name: caps, type: u8}
      - {name: icons, type: u8}
      - {name: gen, type: u8}
      - {name: pages, type: u8}

  # tile_update plus a state: 0 value-only, 1 off, 2 on, 3 unavailable. Sent by a hub that knows the
  # remote has caps bit 0; older remotes only ever see tile_update.
  - name: tile_state
    code: 19
    transport: rf
    fields:
      - {name: remote, type: u8}
      - {name: page, type: u8}
      - {name: tile, type: u8}
      - {name: state, type: u8}
      - {name: text, type: str}

  # --- signed firmware update (docs/proto/ota-image.md) -------------------------------------------
  # Hub image upload over ws: begin -> chunk* -> end. One upload at a time; offsets are bytes of the
  # whole HOTA image (header included). `sha` is the lowercase hex SHA-512 of the whole image. A
  # begin that matches a suspended upload (its connection dropped) resumes it: the reply's offset
  # says where to continue. Every reply is an ota_status (same id) or an `error` whose code starts
  # with "ota_". chunk data is at most 4096 bytes decoded.
  - name: ota_begin
    code: 20
    transport: ws
    fields:
      - {name: target, type: u8}   # 1 hub (2 remote is reserved for the RF transport)
      - {name: size, type: u32}
      - {name: build, type: u32}
      - {name: sha, type: str}

  - name: ota_chunk
    code: 21
    transport: ws
    fields:
      - {name: offset, type: u32}
      - {name: data, type: bytes}

  - {name: ota_end, code: 22, transport: ws, fields: []}
  - {name: ota_abort, code: 23, transport: ws, fields: []}

  # state: idle | receiving | applied (hub restarts next) | failed | aborted | rolled_back.
  # rolled_back is also pushed after every hello when the boot hook restored the previous build;
  # `reason` is the hook's text, `build` the build that was rolled back.
  - name: ota_status
    code: 24
    transport: ws
    fields:
      - {name: state, type: str}
      - {name: offset, type: u32}
      - {name: size, type: u32}
      - {name: build, type: u32, optional: true}
      - {name: reason, type: str, optional: true}

  # Change the hub's id and display name (docs/proto/hub-identity.md). `id` is required (the current id keeps it);
  # `name` is optional (absent keeps the stored one, "" clears it). Answered with hub_id_ack, or an `error`
  # {bad_id | bad_name | id_pinned | io}. Takes effect at once: hello_ack and the mDNS announcements use it.
  - name: set_hub_id
    code: 26
    transport: ws
    fields:
      - {name: id, type: str}
      - {name: name, type: str, optional: true}

  - name: hub_id_ack
    code: 27
    transport: ws
    fields:
      - {name: hub_id, type: str}
      - {name: name, type: str, optional: true}

  # theme_push: the 99-byte wire theme of a config generation (docs/proto/themes-transport.md). Acked like page_push; the
  # hub treats it like one (supersedes by (type, remote), dropped when a newer generation is pushed, resent while attached).
  - name: theme_push
    code: 28
    transport: both
    fields:
      - {name: remote, type: u8}
      - {name: gen, type: u8}
      - {name: data, type: bytes}

  # 29 spare. 30..34 are RESERVED for the remote's RF transport (not implemented): the hub
  # relays a verified remote image as fragments and the remote answers per window.
  - name: ota_offer
    code: 30
    transport: rf
    fields:
      - {name: size, type: u32}
      - {name: build, type: u32}

  - name: ota_frag
    code: 31
    transport: rf
    fields:
      - {name: offset, type: u32}
      - {name: data, type: bytes}

  - name: ota_frag_ack
    code: 32
    transport: rf
    fields:
      - {name: offset, type: u32}

  - {name: ota_commit, code: 33, transport: rf, fields: []}

  - name: ota_result
    code: 34
    transport: rf
    fields:
      - {name: code, type: u8}
      - {name: build, type: u32}

  # Bluetooth HID (docs/proto/bluetooth.md), ws only, authenticated. 35/37/38 are requests; 36 is the hub's
  # state push (also the reply to bt_pair / bt_forget, and sent to every client on any change).
  # bt_pair: on=true opens the pairing window for `secs` (default 120, 1..300) on `transport` (default any), on=false closes it.
  - name: bt_pair
    code: 35
    transport: ws
    fields:
      - {name: "on", type: bool}
      - {name: secs, type: u16, optional: true}
      - {name: transport, type: str, optional: true}  # any (default) | classic | le
      - {name: mode, type: str, optional: true}       # host (default: be discoverable to a phone/TV) | remote (scan for and bond an advertising LE remote; transport any|le)
      - {name: addr, type: str, optional: true}       # mode remote, on: AA:BB:CC:DD:EE:FF of a listed bt_state candidate to bond; absent = open the window and scan only

  # state: off | starting | ready | no_adapter | disabled. pairing = the last pairing outcome
  # {result: ok|failed|refused, addr, name?, transport?, kind?: host|remote}. hosts = [{slot, addr, name?, transport: classic|le, connected, configured?}]
  # (configured: a config bt_hosts entry carries this address, `slot` is then the config slot; false/absent = bonded in the hub only).
  - name: bt_state
    code: 36
    transport: ws
    fields:
      - {name: state, type: str}
      - {name: discoverable, type: bool}
      - {name: discoverable_secs, type: u16, optional: true}
      - {name: le, type: bool, optional: true}  # the adapter can do Bluetooth LE
      - {name: gen, type: u32, optional: true}  # bumped by the link on every change (not by the discoverable_secs countdown)
      - {name: pairing, type: json, optional: true}
      - {name: hosts, type: json}
      - {name: remotes, type: json, optional: true}  # bonded LE remotes (input): [{slot, addr, name?, connected, battery?}]
      - {name: candidates, type: json, optional: true}  # LE remotes seen while a remote-mode window is open (max 16): [{addr, name?, rssi}]
      - {name: window, type: str, optional: true}  # host | remote while a pairing window is open (or requested and the helper is starting); absent = no window

  - name: bt_forget
    code: 37
    transport: ws
    fields:
      - {name: slot, type: u8}
      - {name: kind, type: str, optional: true}  # host (default) | remote

  # Test-fire one HID usage at a paired host. page 7 = keyboard, 12 = consumer; action down | up | press.
  - name: bt_key
    code: 38
    transport: ws
    fields:
      - {name: slot, type: u8}
      - {name: page, type: u8}
      - {name: usage, type: u16}
      - {name: action, type: str}

  # A key from a bonded LE remote, for the editor's "press a key on the remote to learn it". Sent only to
  # authenticated clients that sent bt_listen on=true; normal key handling happens in the hub and never needs it.
  - name: bt_remote_key
    code: 39
    transport: ws
    fields:
      - {name: slot, type: u8}
      - {name: page, type: u8}
      - {name: usage, type: u16}
      - {name: down, type: bool}

  # Opt this socket in (on=true) or out of bt_remote_key pushes; reset by every hello. Answered with command_result.
  - name: bt_listen
    code: 40
    transport: ws
    fields:
      - {name: "on", type: bool}

# The 35 physical keys of the Harmony Elite remote (docs/hardware/remote-elite.md, "Input").
# `id` is the logical key code carried in key_event.key (u8): stable, unique, < 128 (128+ are page
# soft keys). `evdev` is the Linux input code (event0; Home/Favorites come from event2). `name` is
# stock's name; the HA event type / YAML key name is its snake_case form.
keys:
  - {id: 1, evdev: 103, name: Up}
  - {id: 2, evdev: 108, name: Down}
  - {id: 3, evdev: 105, name: Left}
  - {id: 4, evdev: 106, name: Right}
  - {id: 5, evdev: 352, name: Select}
  - {id: 6, evdev: 139, name: Menu}
  - {id: 7, evdev: 174, name: Exit}
  - {id: 8, evdev: 115, name: VolumeUp}
  - {id: 9, evdev: 114, name: VolumeDown}
  - {id: 10, evdev: 113, name: VolumeMute}
  - {id: 11, evdev: 402, name: ChannelUp}
  - {id: 12, evdev: 403, name: ChannelDown}
  - {id: 13, evdev: 412, name: PrevChannel}
  - {id: 14, evdev: 207, name: Play}
  - {id: 15, evdev: 119, name: Pause}
  - {id: 16, evdev: 128, name: Stop}
  - {id: 17, evdev: 167, name: Record}
  - {id: 18, evdev: 168, name: Rewind}
  - {id: 19, evdev: 159, name: FastForward}
  - {id: 20, evdev: 389, name: DVR}
  - {id: 21, evdev: 395, name: Guide}
  - {id: 22, evdev: 358, name: Info}
  - {id: 23, evdev: 398, name: Red}
  - {id: 24, evdev: 399, name: Green}
  - {id: 25, evdev: 400, name: Yellow}
  - {id: 26, evdev: 401, name: Blue}
  - {id: 27, evdev: 148, name: HomeControl1}
  - {id: 28, evdev: 202, name: HomeControl2}
  - {id: 29, evdev: 149, name: HomeControl3}
  - {id: 30, evdev: 203, name: HomeControl4}
  - {id: 31, evdev: 78, name: HomeControlPlus}
  - {id: 32, evdev: 74, name: HomeControlMinus}
  - {id: 33, evdev: 116, name: PowerOffActivity}
  - {id: 34, evdev: 102, name: Home}
  - {id: 35, evdev: 364, name: Favorites}
