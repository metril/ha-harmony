# Single source of truth for the remote UI themes (tools/gen_themes.py generates
# harmony_core/themes.py, remote/app/theme_presets.[ch], addon/frontend/src/lib/themes.ts and
# tests/vectors/themes.json). Every colour is RGB565-exact (R,B multiples of 8; G multiple of 4).
# ink / pressed are derived (harmony_core/theme_math.py). ids 0..6 are presets (3 bits); 7 is
# reserved for a custom theme. Never reorder or reuse an id.
# Palette order = wire index 1..12 (0 means "no colour": the role default).
palette: [red, orange, amber, yellow, lime, green, teal, cyan, blue, indigo, purple, pink]
themes:
  - key: default # byte-identical to remote/app/theme.h
    id: 0
    name: Cards
    tokens: {bg: "#101820", s1: "#182430", s2: "#202c38", s3: "#304050", tx: "#f8fcf8", tx2: "#a8b4c0", tx3: "#687888", acc: "#20c8b0", onacc: "#081c18", warm: "#f8c040", onwarm: "#101820", bad: "#f85848", onbad: "#100808"}
    palette: {red: "#f85848", orange: "#f88830", amber: "#f8c040", yellow: "#f0e048", lime: "#a8d848", green: "#48c868", teal: "#20c8b0", cyan: "#40c8f0", blue: "#6098f8", indigo: "#8890f8", purple: "#b880f0", pink: "#f078b8"}
  - key: midnight # true-black ground for night use: dimmer fills, no glare
    id: 1
    name: Midnight
    tokens: {bg: "#000000", s1: "#182028", s2: "#283038", s3: "#405060", tx: "#d8dcd8", tx2: "#9098a0", tx3: "#707880", acc: "#7888f8", onacc: "#000010", warm: "#f8b040", onwarm: "#000000", bad: "#f86060", onbad: "#000000"}
    palette: {red: "#e85048", orange: "#e88038", amber: "#e0b040", yellow: "#d8d050", lime: "#a0c850", green: "#50b870", teal: "#38b8a8", cyan: "#48b8e0", blue: "#6890e8", indigo: "#8088e8", purple: "#a880e0", pink: "#e070a8"}
  - key: daylight # light ground, white cards, deep saturated fills
    id: 2
    name: Daylight
    tokens: {bg: "#e8ecf0", s1: "#f8fcf8", s2: "#d8e0e8", s3: "#c0c8d0", tx: "#101820", tx2: "#485868", tx3: "#687888", acc: "#087c70", onacc: "#f8fcf8", warm: "#a86000", onwarm: "#f8fcf8", bad: "#c82828", onbad: "#f8fcf8"}
    palette: {red: "#c02828", orange: "#a84808", amber: "#f0b020", yellow: "#e8d030", lime: "#487008", green: "#187840", teal: "#087068", cyan: "#006c98", blue: "#2858c8", indigo: "#4848c0", purple: "#8040b0", pink: "#b03080"}
  - key: high_contrast # black ground, white text, pure saturated fills
    id: 3
    name: High contrast
    tokens: {bg: "#000000", s1: "#202020", s2: "#303030", s3: "#585858", tx: "#f8fcf8", tx2: "#d8d8d8", tx3: "#a0a0a0", acc: "#f8e000", onacc: "#000000", warm: "#f8a000", onwarm: "#000000", bad: "#f86060", onbad: "#000000"}
    palette: {red: "#f83838", orange: "#f88000", amber: "#f8b800", yellow: "#f8f800", lime: "#90f800", green: "#00e050", teal: "#00e8c8", cyan: "#00d8f8", blue: "#5898f8", indigo: "#9090f8", purple: "#c068f8", pink: "#f868c8"}
