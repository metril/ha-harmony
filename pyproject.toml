[project]
name = "ha-harmony"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["pyyaml"]

[dependency-groups]
dev = ["pytest", "pytest-xdist", "pytest-asyncio", "ruff", "pyyaml"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
extend-exclude = ["proto/gen"]
