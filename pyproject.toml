[project]
name = "ha-harmony"
version = "0.1.0"
requires-python = ">=3.14.2"
dependencies = ["pyyaml"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist",
    "pytest-asyncio",
    "ruff",
    "pyyaml",
    "aiohttp>=3.14.5",
    "pytest-homeassistant-custom-component>=0.13",
    "pytest-shard>=0.1.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/py"]
addopts = "--dist=worksteal"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
extend-exclude = ["proto/gen", "custom_components/ha_harmony/harmony_proto.py"]
