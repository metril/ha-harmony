name: Harmony Editor
version: "0.1.0"
slug: ha_harmony_editor
description: Visual editor, IR database and preview for the Harmony hub (feeds the Harmony integration)
url: https://github.com/metril/ha-harmony
arch:
  - aarch64
  - amd64
init: false
stage: experimental
image: ghcr.io/metril/ha-harmony-editor-{arch}
ingress: true
ingress_port: 8099
panel_icon: mdi:remote
panel_title: Harmony
panel_admin: true
hassio_api: false
homeassistant_api: false
backup_exclude:
  - ircache/*
options:
  hub_port: 8099
  log_level: info
schema:
  hub_host: str?
  hub_port: port
  hub_token: password?
  log_level: list(debug|info|warning|error)
