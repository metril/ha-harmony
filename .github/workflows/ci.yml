name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure -j

  py-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python deps
        run: uv sync --locked
      - name: Build C binaries
        run: |
          cmake -S . -B build
          cmake --build build -j --target hub remote_sim
      - name: Test
        run: >-
          uv run pytest tests/py -n auto
          --shard-id=${{ matrix.shard }} --num-shards=3

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .

  cross-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mips
            toolchain: mips32--uclibc--stable-2025.08-1
            arch_dir: mips32
            sha256: 0218bfa5ef4624350e48cc372632fb4bac60db54822a56f5565d4144c180f095
            tc_file: hub-mips
            binary: hub
            expect: 'ELF 32-bit MSB.*MIPS.*statically linked'
          - name: arm
            toolchain: armv5-eabi--uclibc--stable-2025.08-1
            arch_dir: armv5-eabi
            sha256: e5415d32b39e94bf7b990ea4ead3619bf7055e338309d2cce2b6de2dd7307f12
            tc_file: remote-arm
            binary: remote
            expect: 'ELF 32-bit LSB.*ARM.*statically linked'
    env:
      HP_TOOLCHAIN_ROOT: ${{ github.workspace }}/toolchain
    steps:
      - uses: actions/checkout@v4
      - name: Cache toolchain
        id: tc-cache
        uses: actions/cache@v4
        with:
          path: toolchain
          key: bootlin-${{ matrix.toolchain }}-${{ matrix.sha256 }}
      - name: Download toolchain
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          url=https://toolchains.bootlin.com/downloads/releases/toolchains/${{ matrix.arch_dir }}/tarballs/${{ matrix.toolchain }}.tar.xz
          curl -fsSL --retry 3 -o tc.tar.xz "$url"
          echo "${{ matrix.sha256 }}  tc.tar.xz" | sha256sum -c -
          mkdir toolchain
          tar -xf tc.tar.xz -C toolchain --strip-components=1
          rm tc.tar.xz
      - name: Configure
        run: >-
          cmake -S . -B build-cross -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=$PWD/cmake/toolchains/${{ matrix.tc_file }}.cmake
      - name: Build
        run: cmake --build build-cross -j
      - name: Assert static ${{ matrix.name }} binary
        run: |
          out=$(file build-cross/${{ matrix.binary }})
          echo "$out"
          echo "$out" | grep -E '${{ matrix.expect }}'
      - name: Run C tests under qemu (big-endian check)
        if: matrix.name == 'mips'
        run: |
          sudo apt-get update -qq
          # Newer Ubuntu images ship the static emulators in qemu-user.
          sudo apt-get install -y -qq qemu-user-static || sudo apt-get install -y -qq qemu-user
          qemu=$(command -v qemu-mips-static || command -v qemu-mips)
          cmake -S . -B build-cross-test -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$PWD/cmake/toolchains/hub-mips.cmake \
            -DHP_BUILD_TESTS=ON -DCMAKE_CROSSCOMPILING_EMULATOR="$qemu"
          cmake --build build-cross-test -j
          ctest --test-dir build-cross-test --output-on-failure -j

  ci:
    if: always()
    needs: [c-tests, py-tests, lint, cross-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "job result: $r"; exit 1; }
          done
