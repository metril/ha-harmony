name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure -j

  py-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python deps
        run: uv sync --locked
      - name: Build C binaries
        run: |
          cmake -S . -B build
          cmake --build build -j --target hub remote_sim
      - name: Test
        run: >-
          uv run pytest tests/py -n auto
          --shard-id=${{ matrix.shard }} --num-shards=3

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .

  cross-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mips
            # OpenWrt ath79 SDK toolchain: gcc 13.3, musl, soft-float (the hub's
            # AR9330/24Kc has no FPU). Keep in step with tools/fetch_toolchains.sh.
            toolchain: openwrt-24.10.0-ath79-gcc13.3-musl
            url: https://downloads.openwrt.org/releases/24.10.0/targets/ath79/generic/openwrt-toolchain-24.10.0-ath79-generic_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            sha256: ef3087ea607f52f5127c9d0bd74581f78ba26093f29b6330951117676eb66207
            strip: 2
            tar_flag: --zstd
            tc_file: hub-mips
            binary: hub
            expect: 'ELF 32-bit MSB.*MIPS.*statically linked'
          - name: arm
            toolchain: armv5-eabi--uclibc--stable-2025.08-1
            url: https://toolchains.bootlin.com/downloads/releases/toolchains/armv5-eabi/tarballs/armv5-eabi--uclibc--stable-2025.08-1.tar.xz
            strip: 1
            tar_flag: -J
            sha256: e5415d32b39e94bf7b990ea4ead3619bf7055e338309d2cce2b6de2dd7307f12
            tc_file: remote-arm
            binary: remote
            expect: 'ELF 32-bit LSB.*ARM.*statically linked'
    env:
      HP_TOOLCHAIN_ROOT: ${{ github.workspace }}/toolchain
      STAGING_DIR: ${{ github.workspace }}/toolchain
    steps:
      - uses: actions/checkout@v4
      - name: Cache toolchain
        id: tc-cache
        uses: actions/cache@v4
        with:
          path: toolchain
          key: bootlin-${{ matrix.toolchain }}-${{ matrix.sha256 }}
      - name: Download toolchain
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o tc.tar "${{ matrix.url }}"
          echo "${{ matrix.sha256 }}  tc.tar" | sha256sum -c -
          mkdir toolchain
          tar ${{ matrix.tar_flag }} -xf tc.tar -C toolchain --strip-components=${{ matrix.strip }}
          rm tc.tar
      - name: Configure
        run: >-
          cmake -S . -B build-cross -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=$PWD/cmake/toolchains/${{ matrix.tc_file }}.cmake
      - name: Build
        run: cmake --build build-cross -j
      - name: Assert static ${{ matrix.name }} binary
        run: |
          out=$(file build-cross/${{ matrix.binary }})
          echo "$out"
          echo "$out" | grep -E '${{ matrix.expect }}'
      - name: Assert hub is soft-float (AR9330 has no FPU; hard-float is SIGILL)
        if: matrix.name == 'mips'
        run: |
          readelf -A build-cross/hub | tee /dev/stderr | grep -q 'Soft float'
      - name: Run C tests under qemu (big-endian, soft-float)
        if: matrix.name == 'mips'
        run: |
          sudo apt-get update -qq
          # Newer Ubuntu images ship the static emulators in qemu-user.
          sudo apt-get install -y -qq qemu-user-static || sudo apt-get install -y -qq qemu-user
          qemu=$(command -v qemu-mips-static || command -v qemu-mips)
          cmake -S . -B build-cross-test -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$PWD/cmake/toolchains/hub-mips.cmake \
            -DHP_BUILD_TESTS=ON -DCMAKE_CROSSCOMPILING_EMULATOR="$qemu"
          cmake --build build-cross-test -j
          ctest --test-dir build-cross-test --output-on-failure -j

  ci:
    if: always()
    needs: [c-tests, py-tests, lint, cross-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "job result: $r"; exit 1; }
          done
