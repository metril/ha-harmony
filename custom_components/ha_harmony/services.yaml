reload_config:
  fields:
    config_entry: &entry
      required: false
      selector:
        config_entry:
          integration: ha_harmony
push_pages:
  fields:
    config_entry: *entry
send_ir:
  fields:
    config_entry: *entry
    ir:
      required: true
      example: '{"proto": "nec", "addr": 4, "cmd": 8}'
      selector:
        object:
set_device_state:
  fields:
    config_entry: *entry
    device:
      required: true
      example: tv
      selector:
        text:
    power:
      required: false
      selector:
        boolean:
    input:
      required: false
      example: hdmi1
      selector:
        text:
install_firmware:
  fields:
    config_entry: *entry
    path:
      required: true
      example: /config/ha_harmony/firmware/hub-12.img
      selector:
        text:
    allow_dev_key:
      required: false
      default: false
      selector:
        boolean:
bt_pair:
  fields:
    config_entry: *entry
    mode:
      required: false
      default: host
      selector:
        select:
          options: [host, remote]
    transport:
      required: false
      default: any
      selector:
        select:
          options: [any, classic, le]
    seconds:
      required: false
      default: 120
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: s
    address:
      required: false
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
bt_stop_pairing:
  fields:
    config_entry: *entry
bt_forget:
  fields:
    config_entry: *entry
    address:
      required: true
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
bt_listen:
  fields:
    config_entry: *entry
    "on":
      required: false
      default: true
      selector:
        boolean:
    seconds:
      required: false
      default: 60
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: s
